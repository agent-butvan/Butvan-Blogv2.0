version: '3.8'

services:
  # 1. 数据库 PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: always
    mem_limit: 256m
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-butvan_blog}
      POSTGRES_USER: ${POSTGRES_USER:-butvan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # 将容器内的数据库数据挂载到宿主机当前目录下的 data/postgres 目录，保证数据持久化
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - blog-network

  # 2. 缓存 Redis
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    mem_limit: 64m
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      # 挂载 Redis 数据目录
      - ./data/redis:/data
    ports:
      - "6379:6379"
    networks:
      - blog-network

  # 3. Spring Boot 后端
  blog-service:
    image: crpi-46o5657v3drrpfcl.cn-hangzhou.personal.cr.aliyuncs.com/butvan/blog-service:latest
    container_name: blog-service
    restart: always
    mem_limit: 512m
    depends_on:
      - postgres
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-butvan_blog}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-butvan}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      WEIXIN_APPID: ${WEIXIN_APPID}
      WEIXIN_APPSECRET: ${WEIXIN_APPSECRET}
      MAIL_HOST: ${MAIL_HOST:-smtp.qq.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_MINIO_CUSTOM_DOMAIN: ${STORAGE_MINIO_CUSTOM_DOMAIN}
    volumes:
      - ./uploads:/app/uploads
    networks:
      - blog-network

  # 4. 后台管理前端
  blog-admin:
    image: crpi-46o5657v3drrpfcl.cn-hangzhou.personal.cr.aliyuncs.com/butvan/blog-admin:latest
    container_name: blog-admin
    restart: always
    mem_limit: 256m
    environment:
      NEXT_PUBLIC_API_URL: http://blog-service:8080
      BACKEND_URL: http://blog-service:8080
    networks:
      - blog-network

  # 5. 博客前台前端
  blog-client:
    image: crpi-46o5657v3drrpfcl.cn-hangzhou.personal.cr.aliyuncs.com/butvan/blog-client:latest
    container_name: blog-client
    restart: always
    mem_limit: 256m
    environment:
      NEXT_PUBLIC_API_URL: http://blog-service:8080
      BACKEND_URL: http://blog-service:8080
    networks:
      - blog-network

  # 6. Caddy 反向代理网关（自动申请 SSL 证书与域名绑定）
  caddy:
    image: caddy:2-alpine
    container_name: blog-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      CLIENT_DOMAIN: ${CLIENT_DOMAIN:-localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./data/caddy_data:/data
      - ./data/caddy_config:/config
    networks:
      - blog-network
    depends_on:
      - blog-client
      - blog-admin
      - blog-service

networks:
  blog-network:
    driver: bridge
